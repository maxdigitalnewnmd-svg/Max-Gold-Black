<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 56 56" width="56" height="56">
  <defs>
    <radialGradient id="vibroTire" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#1c2229"/>
      <stop offset="85%" stop-color="#101418"/>
      <stop offset="100%" stop-color="#080a0c"/>
    </radialGradient>
    <radialGradient id="vibroRim" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#34495e"/>
      <stop offset="65%" stop-color="#1c2833"/>
      <stop offset="100%" stop-color="#0e171f"/>
    </radialGradient>
  </defs>

  <!-- 1. Enorme neumático todoterreno de gran diámetro (como en la foto real) -->
  <circle cx="0" cy="0" r="26" fill="url(#vibroTire)" stroke="#090c0f" stroke-width="2.5"/>

  <!-- Tacos agrícolas/desérticos en V agresivos alrededor del neumático -->
  <g stroke="#090c0f" stroke-width="4" stroke-linecap="round">
    <line x1="-26" y1="0" x2="-20" y2="0"/>
    <line x1="26" y1="0" x2="20" y2="0"/>
    <line x1="0" y1="-26" x2="0" y2="-20"/>
    <line x1="0" y1="26" x2="0" y2="20"/>
    <line x1="-18.4" y1="-18.4" x2="-14" y2="-14"/>
    <line x1="18.4" y1="18.4" x2="14" y2="14"/>
    <line x1="-18.4" y1="18.4" x2="-14" y2="14"/>
    <line x1="18.4" y1="-18.4" x2="14" y2="-14"/>
    <!-- Tacos secundarios intermedios -->
    <line x1="-24" y1="-10" x2="-19" y2="-8"/>
    <line x1="24" y1="10" x2="19" y2="8"/>
    <line x1="-24" y1="10" x2="-19" y2="8"/>
    <line x1="24" y1="-10" x2="19" y2="-8"/>
    <line x1="-10" y1="-24" x2="-8" y2="-19"/>
    <line x1="10" y1="24" x2="8" y2="19"/>
    <line x1="10" y1="-24" x2="8" y2="-19"/>
    <line x1="-10" y1="24" x2="-8" y2="19"/>
  </g>

  <!-- 2. Llanta de acero pesado cóncava -->
  <circle cx="0" cy="0" r="16" fill="url(#vibroRim)" stroke="#1a252f" stroke-width="2"/>
  <circle cx="0" cy="0" r="12" fill="#17202a" stroke="#0e171f" stroke-width="1.2"/>

  <!-- 3. Cubo central macizo y pernos cromados de alta visibilidad -->
  <circle cx="0" cy="0" r="7" fill="#2c3e50" stroke="#1c2833" stroke-width="1.5"/>
  <circle cx="0" cy="0" r="3" fill="#e74c3c"/>

  <!-- 8 pernos circulares cromados que marcan el giro con claridad -->
  <circle cx="0" cy="-11" r="1.5" fill="#f4f6f7" stroke="#34495e" stroke-width="0.6"/>
  <circle cx="7.8" cy="-7.8" r="1.5" fill="#f4f6f7" stroke="#34495e" stroke-width="0.6"/>
  <circle cx="11" cy="0" r="1.5" fill="#f4f6f7" stroke="#34495e" stroke-width="0.6"/>
  <circle cx="7.8" cy="7.8" r="1.5" fill="#f4f6f7" stroke="#34495e" stroke-width="0.6"/>
  <circle cx="0" cy="11" r="1.5" fill="#f4f6f7" stroke="#34495e" stroke-width="0.6"/>
  <circle cx="-7.8" cy="7.8" r="1.5" fill="#f4f6f7" stroke="#34495e" stroke-width="0.6"/>
  <circle cx="-11" cy="0" r="1.5" fill="#f4f6f7" stroke="#34495e" stroke-width="0.6"/>
  <circle cx="-7.8" cy="-7.8" r="1.5" fill="#f4f6f7" stroke="#34495e" stroke-width="0.6"/>
</svg>
