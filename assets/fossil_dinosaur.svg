<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <filter id="bone-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#150f0c" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#bone-shadow)">
    <!-- Cráneo principal de dinosaurio terópodo -->
    <!-- Bóveda craneal y hocico -->
    <path d="M 40 100 C 40 85, 55 60, 90 50 C 130 40, 190 45, 230 65 C 245 72, 255 85, 250 95 C 245 105, 230 110, 205 108 C 170 105, 140 105, 120 115 C 95 128, 65 130, 45 115 Z" fill="#e8dcc4" stroke="#4a3728" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Cuenca ocular (Eye socket) -->
    <path d="M 155 68 C 170 65, 185 75, 180 92 C 175 102, 160 100, 150 90 C 145 80, 148 70, 155 68 Z" fill="#221813" stroke="#5a4433" stroke-width="2"/>
    
    <!-- Fosa nasal y aberturas fenestra cráneo -->
    <ellipse cx="225" cy="80" rx="14" ry="7" fill="#221813" transform="rotate(-10 225 80)"/>
    <path d="M 115 72 C 130 65, 140 75, 135 88 C 130 95, 120 95, 112 85 Z" fill="#221813"/>

    <!-- Mandíbula inferior -->
    <path d="M 55 125 C 90 120, 160 118, 200 116 C 225 115, 235 122, 230 130 C 220 140, 180 142, 140 140 C 95 142, 65 145, 50 136 Z" fill="#ddceb2" stroke="#4a3728" stroke-width="3" stroke-linejoin="round"/>

    <!-- Dientes afilados fosilizados superiores e inferiores -->
    <polygon points="190,108 194,118 198,108" fill="#fffaf0" stroke="#5a4433" stroke-width="1"/>
    <polygon points="202,108 206,120 210,108" fill="#fffaf0" stroke="#5a4433" stroke-width="1"/>
    <polygon points="214,107 218,119 222,107" fill="#fffaf0" stroke="#5a4433" stroke-width="1"/>
    <polygon points="225,104 229,115 233,104" fill="#fffaf0" stroke="#5a4433" stroke-width="1"/>
    <polygon points="236,98 240,108 244,98" fill="#fffaf0" stroke="#5a4433" stroke-width="1"/>

    <polygon points="195,120 199,112 203,120" fill="#fffaf0" stroke="#5a4433" stroke-width="1"/>
    <polygon points="208,120 212,111 216,120" fill="#fffaf0" stroke="#5a4433" stroke-width="1"/>
    <polygon points="220,121 224,113 228,121" fill="#fffaf0" stroke="#5a4433" stroke-width="1"/>

    <!-- Vértebras del cuello conectadas -->
    <path d="M 42 100 C 30 102, 22 112, 25 125 C 28 135, 40 138, 48 130 Z" fill="#d5c4a5" stroke="#4a3728" stroke-width="2"/>
    <path d="M 22 115 C 12 118, 5 128, 8 138 C 12 145, 22 146, 28 138 Z" fill="#c8b594" stroke="#4a3728" stroke-width="2"/>

    <!-- Grietas de mineralización fósil -->
    <path d="M 85 55 Q 100 80 120 85" stroke="#5a4433" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 175 52 Q 185 62 180 67" stroke="#5a4433" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 130 130 Q 145 135 170 132" stroke="#5a4433" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
