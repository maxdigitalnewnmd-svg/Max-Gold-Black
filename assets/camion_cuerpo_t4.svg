<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" width="200" height="110">
  <defs>
    <filter id="t4Shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="t4Titanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#485460"/>
      <stop offset="50%" stop-color="#2d3436"/>
      <stop offset="100%" stop-color="#1e272e"/>
    </linearGradient>
    <linearGradient id="t4Neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2d3"/>
      <stop offset="50%" stop-color="#01a3a4"/>
      <stop offset="100%" stop-color="#54a0ff"/>
    </linearGradient>
    <linearGradient id="t4Glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7ecee"/>
      <stop offset="40%" stop-color="#22a6b3"/>
      <stop offset="100%" stop-color="#130f40"/>
    </linearGradient>
  </defs>

  <g filter="url(#t4Shadow)">
    <!-- CHASIS CIBERNÉTICO TITANIO TIER 4 (Élite Petróleo 90%) -->
    <rect x="16" y="62" width="172" height="12" rx="3" fill="#130f40" stroke="#00d2d3" stroke-width="1.8"/>

    <!-- Pasos de rueda con iluminación LED cian inferior -->
    <path d="M 16 72 C 16 46, 66 46, 66 72 Z" fill="#0c0e12"/>
    <path d="M 66 72 C 66 46, 110 46, 110 72 Z" fill="#0c0e12"/>
    <path d="M 144 72 C 144 46, 194 46, 194 72 Z" fill="#0c0e12"/>
    
    <!-- Tiras de neón cian bajo chasis -->
    <line x1="20" y1="62" x2="184" y2="62" stroke="#00d2d3" stroke-width="2"/>

    <!-- TORRE HIDRÁULICA RESONANTE DE ALTA FRECUENCIA (Sub-bass Quantum Seismic Rig) -->
    <rect x="112" y="22" width="10" height="50" rx="2" fill="url(#t4Titanium)" stroke="#00d2d3" stroke-width="1.5"/>
    <rect x="138" y="22" width="10" height="50" rx="2" fill="url(#t4Titanium)" stroke="#00d2d3" stroke-width="1.5"/>
    <rect x="108" y="20" width="44" height="7" rx="2" fill="url(#t4Neon)"/>
    <!-- Bobinas de resonancia cuántica -->
    <line x1="117" y1="28" x2="117" y2="60" stroke="#00d2d3" stroke-width="3" stroke-dasharray="2,2"/>
    <line x1="143" y1="28" x2="143" y2="60" stroke="#00d2d3" stroke-width="3" stroke-dasharray="2,2"/>

    <!-- MÓDULO COMPUTACIONAL GEOLÓGICO TRASERO -->
    <path d="M 18 18 L 108 18 L 108 62 L 18 62 Z" fill="url(#t4Titanium)" stroke="#00d2d3" stroke-width="1.5"/>
    <rect x="18" y="38" width="90" height="8" fill="url(#t4Neon)"/>
    <text x="24" y="44" font-family="sans-serif" font-size="6" font-weight="bold" fill="#000000">QUANTUM OIL T4</text>

    <!-- Gran Antena Parabólica Sensorizada orientada hacia el horizonte -->
    <ellipse cx="38" cy="14" rx="14" ry="7" fill="url(#t4Neon)" stroke="#ffffff" stroke-width="1"/>
    <line x1="38" y1="14" x2="48" y2="4" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="48" cy="4" r="3" fill="#ff4757"/>

    <!-- CABINA FUTURISTA CYBERTRUCK / DAKAR -->
    <path d="M 144 10 L 180 10 L 196 32 L 200 62 L 144 62 Z" fill="url(#t4Titanium)" stroke="#00d2d3" stroke-width="1.5"/>
    <!-- Gran visor panorámico cian polarizado -->
    <path d="M 166 14 L 190 32 L 166 32 Z" fill="url(#t4Glass)" stroke="#00d2d3" stroke-width="1.5"/>
    <rect x="148" y="14" width="16" height="18" rx="2" fill="url(#t4Glass)" stroke="#00d2d3" stroke-width="1.5"/>

    <!-- Faro de escaneo láser frontal cian -->
    <rect x="194" y="44" width="6" height="6" rx="1" fill="#00d2d3"/>
    <polygon points="196,52 202,52 200,64 194,64" fill="#00d2d3"/>
  </g>
</svg>
