<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 110" width="190" height="110">
  <defs>
    <filter id="vibroBodyShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0a0705" flood-opacity="0.65"/>
    </filter>

    <!-- Blanco industrial limpio y brillante (como el camión de la foto) -->
    <linearGradient id="whiteIndustrial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8f9f9"/>
      <stop offset="85%" stop-color="#e5e8e8"/>
      <stop offset="100%" stop-color="#bdc3c7"/>
    </linearGradient>

    <!-- Cristal polarizado con reflejo de cielo -->
    <linearGradient id="cabGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebf5fb"/>
      <stop offset="35%" stop-color="#aed6f1"/>
      <stop offset="80%" stop-color="#2e86c1"/>
      <stop offset="100%" stop-color="#1b4f72"/>
    </linearGradient>

    <!-- Acero estructural oscuro del chasis -->
    <linearGradient id="chassisSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34495e"/>
      <stop offset="60%" stop-color="#212f3d"/>
      <stop offset="100%" stop-color="#17202a"/>
    </linearGradient>
  </defs>

  <g filter="url(#vibroBodyShadow)">
    <!-- 1. CHASIS PESADO ARTICULADO CON PASOS DE RUEDA GIGANTES -->
    <!-- Viga maestra de acero inferior -->
    <rect x="22" y="62" width="152" height="11" rx="3" fill="url(#chassisSteel)" stroke="#0e171f" stroke-width="1.5"/>

    <!-- Paso de rueda gigante trasero (cx=44, cy=72, r=26) -->
    <path d="M 16 72 C 16 48, 72 48, 72 72 Z" fill="#141c24" stroke="#0e171f" stroke-width="1.5"/>

    <!-- Paso de rueda gigante delantero (cx=146, cy=72, r=26) -->
    <path d="M 118 72 C 118 48, 174 48, 174 72 Z" fill="#141c24" stroke="#0e171f" stroke-width="1.5"/>

    <!-- 2. PÓRTICO HIDRÁULICO CENTRAL (TORRE VIBROSEIS DONDE BAJA LA PLACA) -->
    <!-- Columnas maestras de acero blanco que guían los pistones -->
    <rect x="76" y="38" width="8" height="34" rx="2" fill="url(#whiteIndustrial)" stroke="#7f8c8d" stroke-width="1.2"/>
    <rect x="106" y="38" width="8" height="34" rx="2" fill="url(#whiteIndustrial)" stroke="#7f8c8d" stroke-width="1.2"/>
    <rect x="72" y="35" width="46" height="7" rx="2" fill="url(#whiteIndustrial)" stroke="#7f8c8d" stroke-width="1.2"/>
    
    <!-- Mangueras hidráulicas de alta presión negras -->
    <path d="M 74 42 Q 68 50 78 56" stroke="#17202a" stroke-width="2.5" fill="none"/>
    <path d="M 116 42 Q 122 50 112 56" stroke="#17202a" stroke-width="2.5" fill="none"/>

    <!-- 3. MÓDULO TRASERO: MOTOR DIÉSEL Y COMPRESOR (COMO EN LA FOTO) -->
    <path d="M 18 28 L 72 28 L 72 62 L 18 62 Z" fill="url(#whiteIndustrial)" stroke="#95a5a6" stroke-width="1.5"/>
    <!-- Franja naranja de seguridad lateral -->
    <rect x="18" y="44" width="54" height="6" fill="#e67e22"/>

    <!-- Rejillas de ventilación y filtros de aire industriales -->
    <g stroke="#7f8c8d" stroke-width="2" stroke-linecap="round">
      <line x1="26" y1="34" x2="48" y2="34"/>
      <line x1="26" y1="38" x2="48" y2="38"/>
      <line x1="54" y1="34" x2="66" y2="34"/>
      <line x1="54" y1="38" x2="66" y2="38"/>
    </g>

    <!-- Filtro de aire cilíndrico exterior y chimenea de escape vertical -->
    <rect x="22" y="16" width="10" height="13" rx="2" fill="#34495e" stroke="#1c2833" stroke-width="1"/>
    <rect x="64" y="12" width="4" height="17" rx="1.5" fill="#7f8c8d" stroke="#566573" stroke-width="1"/>
    <path d="M 64 12 Q 61 8 57 8" stroke="#7f8c8d" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- 4. CABINA FRONTAL ALTA Y MONUMENTAL (COMO EN LA FOTO REAL) -->
    <!-- Carrocería de cabina angulada blanca -->
    <path d="M 118 16 L 162 16 L 174 36 L 178 62 L 118 62 Z" fill="url(#whiteIndustrial)" stroke="#95a5a6" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Franja naranja en la puerta de la cabina (como en la foto de referencia) -->
    <rect x="120" y="40" width="42" height="6" fill="#e67e22"/>

    <!-- Puerta de acceso con manija -->
    <rect x="120" y="20" width="30" height="40" rx="2" fill="none" stroke="#bdc3c7" stroke-width="1"/>
    <rect x="145" y="42" width="3" height="2" fill="#2c3e50"/>

    <!-- Gran parabrisas y ventana panorámica de la puerta -->
    <path d="M 152 20 L 168 36 L 152 36 Z" fill="url(#cabGlass)" stroke="#1a5276" stroke-width="1.2"/>
    <rect x="124" y="20" width="26" height="18" rx="2" fill="url(#cabGlass)" stroke="#1a5276" stroke-width="1.2"/>
    <path d="M 128 21 L 138 21 L 126 36 L 124 36 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Estribos / Escalera de acceso frontal tubular blanca (como en la foto) -->
    <g stroke="url(#whiteIndustrial)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 156 62 L 166 74 L 158 74 L 158 80 L 166 80"/>
      <path d="M 172 62 L 180 62 L 180 72 L 174 72"/>
    </g>

    <!-- Parachoques tubular blanco de expedición delantero -->
    <path d="M 174 54 L 184 54 L 184 66 L 172 66" stroke="url(#whiteIndustrial)" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="178,56 182,56 180,64 176,64" fill="#e67e22"/>

    <!-- Faro frontal xenón angular -->
    <rect x="175" y="47" width="5" height="5" rx="1" fill="#fffde7" stroke="#f39c12" stroke-width="1"/>

    <!-- Barra de luces LED y luz de emergencia ámbar en el techo -->
    <rect x="140" y="12" width="16" height="4" rx="1" fill="#1c2833"/>
    <circle cx="143" cy="14" r="1.2" fill="#fff9c4"/>
    <circle cx="148" cy="14" r="1.2" fill="#fff9c4"/>
    <circle cx="153" cy="14" r="1.2" fill="#fff9c4"/>
    <circle cx="132" cy="12" r="3" fill="#f39c12" stroke="#b95e09" stroke-width="0.8"/>

    <!-- Antena de comunicaciones vertical larga en la cabina -->
    <line x1="132" y1="12" x2="132" y2="2" stroke="#7f8c8d" stroke-width="1.5"/>
  </g>
</svg>
