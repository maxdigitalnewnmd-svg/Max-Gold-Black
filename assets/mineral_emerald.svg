<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#002d18" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g filter="url(#emerald-glow)">
    <!-- Roca matriz oscura donde brotan los prismas -->
    <polygon points="18,65 32,32 75,25 105,48 95,95 55,105 22,90" fill="#242c27" stroke="#121815" stroke-width="2" stroke-linejoin="round"/>

    <!-- Cristal de esmeralda principal (Prisma hexagonal vertical - Verde Muzo) -->
    <!-- Faceta superior del prisma -->
    <polygon points="50,22 68,18 80,28 72,38 52,36 44,28" fill="#b9f6ca" stroke="#00796b" stroke-width="1.5"/>
    
    <!-- Caras frontales del prisma esmeralda -->
    <polygon points="44,28 52,36 48,82 38,72" fill="#00e676" stroke="#004d40" stroke-width="1.5"/>
    <polygon points="52,36 72,38 70,86 48,82" fill="#00c853" stroke="#004d40" stroke-width="1.5"/>
    <polygon points="72,38 80,28 88,72 70,86" fill="#00897b" stroke="#004d40" stroke-width="1.5"/>

    <!-- Segundo cristal inclinado (Cluster de esmeralda) -->
    <polygon points="26,45 36,40 44,48 40,55 30,54 22,48" fill="#69f0ae" stroke="#004d40" stroke-width="1.2"/>
    <polygon points="22,48 30,54 32,80 22,74" fill="#00e676" stroke="#004d40" stroke-width="1.2"/>
    <polygon points="30,54 40,55 42,82 32,80" fill="#00b248" stroke="#004d40" stroke-width="1.2"/>

    <!-- Tercer cristal menor a la derecha -->
    <polygon points="78,50 88,46 95,54 90,60 82,58 75,54" fill="#a7f3d0" stroke="#004d40" stroke-width="1.2"/>
    <polygon points="75,54 82,58 80,78 72,72" fill="#059669" stroke="#004d40" stroke-width="1.2"/>
    <polygon points="82,58 90,60 88,80 80,78" fill="#047857" stroke="#004d40" stroke-width="1.2"/>

    <!-- Reflejos y brillo cristalino blanco -->
    <line x1="52" y1="36" x2="48" y2="78" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <polygon points="62,42 63,45 66,46 63,47 62,50 61,47 58,46 61,45" fill="#ffffff"/>
    <circle cx="48" cy="30" r="1.5" fill="#ffffff"/>
  </g>
</svg>
